name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -U pip
          [ -f requirements.txt ] && .venv/bin/pip install -q -r requirements.txt || true
          [ -f pyproject.toml ] && .venv/bin/pip install -q -e . || true
          .venv/bin/pip install -q pytest
          .venv/bin/python -m pytest -q || .venv/bin/python -m unittest discover -q
