[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openrouter-analytics"
version = "0.1.0"
description = "A Python tool suite to inspect OpenRouter 24h provider stats, cache hit rates, effective pricing, and token shares."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "OpenRouter Analytics Contributor" }
]
dependencies = [
    "requests>=2.28.0",
    "rich>=13.0.0",
    "click>=8.0.0"
]

[project.scripts]
openrouter-analytics = "openrouter_analytics.cli:main"
or-analytics = "openrouter_analytics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["openrouter_analytics"]
