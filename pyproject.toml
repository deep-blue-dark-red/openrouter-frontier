[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openrouter-frontier"
version = "0.2.0"
description = "Inspect OpenRouter 24h provider stats (cache hit rate, latency, throughput, uptime, pricing) and rank providers and models with a cost/utility scoring model and Pareto frontier analysis."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Matthew" }]
dependencies = [
    "requests>=2.28.0",
    "rich>=13.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
openrouter-frontier = "openrouter_frontier.cli:main"
or-frontier = "openrouter_frontier.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["openrouter_frontier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
